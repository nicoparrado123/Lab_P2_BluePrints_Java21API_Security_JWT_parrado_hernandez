server:
  port: 8080

spring:
  # Perfil por defecto: persistencia en memoria, sin base de datos.
  # El perfil "postgres" (application-postgres.yml) vuelve a habilitar DataSource/JPA.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health

blueprints:
  security:
    issuer: "https://decsis-eci/blueprints"
    # Vida del token. Bajarlo a 10 para ver el 401 por expiracion (actividad 4)
    token-ttl-seconds: 3600
    # Tolerancia de reloj al validar exp. Spring usa 60 s por defecto; en 0 expira exacto
    clock-skew-seconds: 0
